name: Coletar vagas

on:
  schedule:
    - cron: "55 20 * * *"   # 17h55 em Salvador (UTC-3)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coletor/requirements.txt
      - name: Coletar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python coletor/coletar.py
      - name: Salvar resultado
        run: |
          git config user.name "robo-vagas"
          git config user.email "robo-vagas@users.noreply.github.com"
          git add docs/vagas.json dados/historico.json docs/estado.json
          git diff --cached --quiet && exit 0
          git commit -m "Vagas de $(date +%d/%m/%Y)"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
